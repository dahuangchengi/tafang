<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>游戏原型交互演示 - 闯关主链路</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      min-height: 100vh;
    }
    .phone-frame {
      width: 100%;
      max-width: 410px;
      height: 760px;
      max-height: 92vh;
      background: #1e293b;
      border: 6px solid #334155;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 480px) {
      .phone-frame {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border: none;
        border-radius: 0;
      }
    }
    .lobby-bg {
      background: linear-gradient(180deg, #3187a2 0%, #2a7891 45%, #23677d 100%);
    }
    .chapter-bg {
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); transform: scale(1); }
      50% { box-shadow: 0 0 0 8px rgba(249, 115, 22, 0); transform: scale(1.04); }
    }
    @keyframes dmgFloat {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-28px) scale(1.15); }
    }
    .animate-float { animation: floatSlow 3.5s ease-in-out infinite; }
    .animate-cta { animation: pulseGlow 2s infinite; }
    @keyframes bulletFly {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); }
      85% { opacity: 1; transform: translate(-50%, -145px) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -165px) scale(0.6); }
    }
    .dmg-pop { animation: dmgFloat 0.75s ease-out forwards; }
    .bullet-shot { animation: bulletFly 0.42s linear forwards; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

    let state = createInitialState();

    // ==================== 定时器管理 ====================
    let mainTickInterval = null;
    let bulletTickInterval = null;
    let modalCountdownInterval = null;
    let arenaMatchTimeout = null;

    function clearModalCountdown() {
      if (modalCountdownInterval) {
        clearInterval(modalCountdownInterval);
        modalCountdownInterval = null;
      }
      if (arenaMatchTimeout) {
        clearTimeout(arenaMatchTimeout);
        arenaMatchTimeout = null;
      }
    }

    function showToast(msg, tone = 'dark') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = tone === 'warn' ? 'bg-rose-600/95 text-white border-rose-400'
        : tone === 'success' ? 'bg-emerald-600/95 text-white border-emerald-400'
        : 'bg-slate-900/95 text-slate-100 border-slate-600';
      el.className = `${colors} border px-3.5 py-2 rounded-xl text-xs font-medium shadow-lg text-center transition-all duration-300`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 300);
      }, 2000);
    }

    // ==================== 辅助计算 ====================
    function getTotalStoredGems() {
      return state.substages.reduce((acc, s) => acc + (s.storedGem || 0), 0);
    }

    function getModeSubstages(mode = state.mode) {
      return mode === 'dungeon' ? state.dungeonSubstages : state.substages;
    }

    function getLatestChallengeStage(mode = 'stage') {
      const list = getModeSubstages(mode);
      const unlocked = list.filter(s => s.unlocked);
      const nextUnclear = unlocked.find(s => !s.cleared);
      return nextUnclear || unlocked[unlocked.length - 1] || list[0];
    }

    function getQuickGoList() {
      return state.substages.filter(s => s.storedGem > 0 || s.sweepable);
    }

    // ==================== 战斗初始化与循环 ====================
    function startBattle(substageId, mode = state.mode) {
      if (mode === 'dungeon') {
        if (state.dungeonTickets < 1) {
          showToast('副本券不足', 'warn');
          state.modal = { type: 'ticket_source' };
          renderModal();
          return;
        }
        state.dungeonTickets -= 1;
      }
      state.mode = mode;
      const stage = getModeSubstages(mode).find(s => s.id === substageId) || getLatestChallengeStage(mode);
      const preset = state.presets[state.activePreset];
      const battleHeroes = preset.heroes.map((hKey, idx) => {
        const meta = state.heroMeta[hKey];
        return {
          slot: idx + 1,
          key: hKey,
          name: meta.name,
          color: meta.color,
          hat: meta.hat,
          symbol: meta.symbol,
          level: idx === 0 ? 3 : 1,
          enabled: true,
          dmg: 0,
          affixes: idx === 0 ? [
            { name: '召唤', icon: '⚡', desc: '伤害提升 <span class="text-emerald-600 font-black">30%</span>' },
            { name: '风刃连射', icon: '🍃', desc: '连射伤害 <span class="text-emerald-600 font-black">+20%</span>' },
            { name: '疾风骤雨', icon: '🌪️', desc: '攻速提升 <span class="text-emerald-600 font-black">15%</span>' },
            { name: '暴击专精', icon: '💥', desc: '暴击率提升 <span class="text-emerald-600 font-black">12%</span>' }
          ] : [
            { name: '基础射击', icon: meta.symbol, desc: '造成 <span class="text-emerald-600 font-black">100%</span> 基础伤害' }
          ]
        };
      });

      state.battle = {
        mode: mode,
        stageId: stage.id,
        stageName: stage.name,
        stageNum: stage.num,
        paused: false,
        wave: 1,
        maxWave: 10,
        timeLeft: 159,
        level: 1,
        exp: 0,
        expMax: 100,
        hp: 2800,
        hpMax: 2800,
        rewardGem: 1200,
        bonusGem: 5000,
        cannonTier: 100, // 100 | 200 | 300
        switchListOpen: false,
        statsOpen: false,
        activeAffixSlot: null, // 1..4 or null
        diceCd: 0,
        skillCd: 0,
        freeRefreshLeft: 10,
        freeRefreshMax: 10,
        monsterHp: 100,
        monsterMaxHp: 100,
        loopStage: false
      };
      state.battle.heroes = battleHeroes;
      state.screen = 'battle';
      state.modal = null;
      clearModalCountdown();
      render();
    }

    function spawnBattleBullets() {
      const b = state.battle;
      if (!b || b.paused || state.modal) return;
      if (state.screen !== 'battle' && state.screen !== 'arena_battle' && state.screen !== 'pool_battle') return;
      if (b.mode === 'pool' && b.autoAtk === false) return;
      const arena = document.getElementById('battle-arena-fx');
      if (!arena) return;

      const tierScale = b.cannonTier >= 300 ? 1.45 : b.cannonTier >= 200 ? 1.2 : 1;
      b.heroes.forEach((h, idx) => {
        if (!h.enabled) return;
        const meta = state.heroMeta[h.key];
        const bullet = document.createElement('div');
        bullet.className = 'bullet-shot pointer-events-none absolute bottom-2 rounded-full z-10';
        bullet.style.left = `${20 + idx * 20}%`;
        const size = Math.round(9 * tierScale);
        bullet.style.width = `${size}px`;
        bullet.style.height = `${Math.round(size * 1.6)}px`;
        bullet.style.background = meta.color;
        bullet.style.border = '1.5px solid #1e293b';
        bullet.style.boxShadow = `0 0 8px ${meta.color}`;
        arena.appendChild(bullet);
        setTimeout(() => bullet.remove(), 440);
      });
    }

    // 主循环（1秒/次，用于大厅倒计时与战斗模拟）
    function startMainLoop() {
      if (mainTickInterval) clearInterval(mainTickInterval);
      if (bulletTickInterval) clearInterval(bulletTickInterval);
      bulletTickInterval = setInterval(spawnBattleBullets, 450);
      mainTickInterval = setInterval(() => {
        // 大厅活动与竞技场赛季倒计时
        state.activityTimers = state.activityTimers.map(t => (t > 0 ? t - 1 : 3600));
        if (state.arena.seasonTimeLeft > 0) state.arena.seasonTimeLeft--;

        if (state.screen === 'battle' && state.battle && !state.battle.paused && !state.modal) {
          const b = state.battle;
          // 技能CD
          if (b.diceCd > 0) b.diceCd--;
          if (b.skillCd > 0) b.skillCd--;

          // 倒计时
          if (b.timeLeft > 0) b.timeLeft--;

          // 英雄自动攻击
          let tickDmg = 0;
          const mult = b.cannonTier / 100;
          b.heroes.forEach(h => {
            if (h.enabled) {
              const meta = state.heroMeta[h.key];
              const d = Math.round((meta.baseDmg + h.level * 35) * mult * (0.9 + Math.random() * 0.25));
              h.dmg += d;
              tickDmg += d;
              if (b.mode !== 'dungeon' && state.gold >= b.cannonTier) {
                state.gold -= Math.round(b.cannonTier * 0.25);
              }
            }
          });

          if (tickDmg > 0) {
            if (b.mode !== 'dungeon') b.rewardGem += Math.round(tickDmg * 0.4);
            b.monsterHp -= Math.max(12, Math.round(tickDmg / 45));
            spawnBattleDmgPop(tickDmg);
          }

          if (b.monsterHp <= 0) {
            b.monsterHp = b.monsterMaxHp;
            if (b.wave < b.maxWave) {
              b.wave++;
            } else {
              triggerVictory();
              return;
            }
          }

          // 经验条缓慢累积（不自动弹窗，由右侧开关手动触发升级选技能）
          if (b.exp < b.expMax) {
            b.exp = Math.min(b.expMax, b.exp + 12);
          }

          renderBattleDynamicParts();
        } else if (state.screen === 'arena_battle' && state.battle && !state.battle.paused && !state.modal) {
          const b = state.battle;
          if (b.diceCd > 0) b.diceCd--;
          if (b.skillCd > 0) b.skillCd--;

          let tickDmg = 0;
          const mult = b.cannonTier / 100;
          b.heroes.forEach(h => {
            if (h.enabled) {
              const meta = state.heroMeta[h.key];
              const d = Math.round((meta.baseDmg + h.level * 35) * mult * (0.9 + Math.random() * 0.25));
              h.dmg += d;
              tickDmg += d;
            }
          });
          if (tickDmg > 0) {
            b.oppHp = Math.max(0, b.oppHp - Math.round(tickDmg * 0.08));
            b.poolGold += Math.round(tickDmg * 1.2);
          }
          // 敌方反击模拟（经验不自动弹窗，由右侧开关手动触发）
          b.hp = Math.max(0, b.hp - Math.round(18 + Math.random() * 20));
          if (b.exp < b.expMax) {
            b.exp = Math.min(b.expMax, b.exp + 12);
          }
          if (b.oppHp <= 0) {
            triggerArenaSettlement(true);
            return;
          }
          if (b.hp <= 0) {
            triggerArenaSettlement(false);
            return;
          }
          renderArenaBattleDynamicParts();
        } else if (state.screen === 'pool_battle' && state.battle && !state.battle.paused && !state.modal) {
          const b = state.battle;
          if (b.skillCd > 0) b.skillCd--;

          let tickDmg = 0;
          const mult = (b.cannonTier / 100) * (b.rage ? 1.5 : 1);
          b.heroes.forEach(h => {
            if (h.enabled) {
              const meta = state.heroMeta[h.key];
              const d = Math.round((meta.baseDmg + h.level * 35) * mult * (0.9 + Math.random() * 0.25));
              h.dmg += d;
              tickDmg += d;
            }
          });
          if (tickDmg > 0) {
            b.poolGold += Math.round(tickDmg * 1.1);
            b.poolGem += Math.round(tickDmg * 0.3);
          }

          if (b.pkActive) {
            b.myPkDmg += Math.max(80, Math.round(tickDmg * 0.6));
            b.oppPkDmg += Math.round(140 + Math.random() * 140);
            b.pkTimeLeft--;
            if (b.pkTimeLeft <= 0) {
              triggerPoolPkSettlement(b.myPkDmg >= b.oppPkDmg);
              return;
            }
          } else {
            // 常规战斗掉血模拟
            b.hp = Math.max(0, b.hp - Math.round(12 + Math.random() * 15));
            if (b.hp <= 0) {
              openPoolReviveModal();
              return;
            }
          }
          renderPoolBattleDynamicParts();
        } else if (state.screen === 'lobby') {
          // 局部刷新大厅倒计时避免整页重绘闪烁
          document.querySelectorAll('[data-act-timer]').forEach(el => {
            const idx = Number(el.getAttribute('data-act-timer'));
            el.textContent = fmtTimer(state.activityTimers[idx]);
          });
        }
      }, 1000);
    }

    function spawnBattleDmgPop(val) {
      const arena = document.getElementById('battle-arena-fx');
      if (!arena) return;
      const pop = document.createElement('div');
      pop.className = 'dmg-pop absolute text-xs font-extrabold text-amber-300 drop-shadow pointer-events-none';
      pop.style.left = `${30 + Math.random() * 40}%`;
      pop.style.top = `${30 + Math.random() * 25}%`;
      pop.textContent = `-${fmtNum(val)}`;
      arena.appendChild(pop);
      setTimeout(() => pop.remove(), 750);
    }

    // ==================== 词条三选一弹窗 ====================
    const AFFIX_POOL = [
      { title: '召唤【烈焰】', desc: '解锁或强化烈焰英雄参战', targetHero: 'fire', affix: '烈焰觉醒 +25% 伤害', isSummon: true },
      { title: '【烈焰狂暴】', desc: '攻击伤害提升 30%', targetHero: 'fire', affix: '烈焰狂暴：攻击 +30%', isSummon: false },
      { title: '召唤【冰瀑海】', desc: '释放冰霜领域减速并造成范围伤害', targetHero: 'ice', affix: '冰瀑海：范围减速', isSummon: true },
      { title: '【雷霆连锁】', desc: '攻击额外弹射 2 个目标', targetHero: 'thunder', affix: '雷霆连锁 +2 目标', isSummon: false },
      { title: '【疾风连射】', desc: '全队攻击速度提升 20%', targetHero: 'wind', affix: '疾风连射：攻速 +20%', isSummon: false },
      { title: '【暴击强化】', desc: '暴击率提升 15%，暴伤 +40%', targetHero: 'wind', affix: '暴击率 +15%', isSummon: false }
    ];

    function rollThreeAffixes() {
      const shuffled = [...AFFIX_POOL].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 3);
    }

    function openSkillChoiceModal() {
      if (!state.battle) return;
      state.battle.paused = true;
      clearModalCountdown();
      state.modal = {
        type: 'skill_choice',
        cards: rollThreeAffixes(),
        countdown: 10
      };
      renderModal();

      modalCountdownInterval = setInterval(() => {
        if (!state.modal || state.modal.type !== 'skill_choice') {
          clearModalCountdown();
          return;
        }
        state.modal.countdown--;
        const cdEl = document.getElementById('skill-auto-cd');
        if (cdEl) cdEl.textContent = `${state.modal.countdown}s后自动为您选择`;
        if (state.modal.countdown <= 0) {
          clearModalCountdown();
          selectSkillCard(0); // 默认选择推荐卡（第1张带“荐”）
        }
      }, 1000);
    }

    function selectSkillCard(idx) {
      if (!state.modal || state.modal.type !== 'skill_choice' || !state.battle) return;
      const card = state.modal.cards[idx];
      clearModalCountdown();
      // 将词条写入对应英雄（若场上无该英雄则写入第一个槽位）
      const target = state.battle.heroes.find(h => h.key === card.targetHero) || state.battle.heroes[0];
      target.level++;
      const cleanName = card.title.replace(/召唤|【|】/g, '') || card.title;
      target.affixes.push({
        name: card.isSummon ? '召唤' : cleanName,
        icon: state.heroMeta[card.targetHero]?.symbol || '⚡',
        desc: card.desc.replace(/(\d+%?)/g, '<span class="text-emerald-600 font-black">$1</span>')
      });

      state.modal = null;
      state.battle.paused = false;
      showToast(`已选择：${card.title}（${target.name} Lv.${target.level}）`, 'success');
      render();
    }

    function refreshSkillCards() {
      if (!state.modal || state.modal.type !== 'skill_choice' || !state.battle) return;
      const b = state.battle;
      if (b.freeRefreshLeft > 0) {
        b.freeRefreshLeft--;
      } else if (b.mode === 'dungeon') {
        showToast('看广告刷新成功');
      } else {
        if (state.redGem < 50) {
          showToast('红钻不足', 'warn');
          return;
        }
        state.redGem -= 50;
        showToast('消耗 50 红钻刷新成功');
      }
      // 明确规则：不重置 10s 倒计时！
      state.modal.cards = rollThreeAffixes();
      renderModal();
    }

    // ==================== 结算流程（成功 / 失败） ====================
    function triggerVictory() {
      if (!state.battle) return;
      const b = state.battle;
      b.paused = true;
      clearModalCountdown();

      const list = getModeSubstages(b.mode);
      const stage = list.find(s => s.id === b.stageId);
      const isFirstClear = stage && !stage.cleared;
      const storedBonus = (b.mode !== 'dungeon' && stage) ? stage.storedGem : 0;

      if (stage) {
        stage.cleared = true;
        if (b.mode !== 'dungeon') {
          stage.sweepable = true;
          stage.storedGem = 0;
        }
        const nextStage = list.find(s => s.chapterId === stage.chapterId && s.num === stage.num + 1);
        if (nextStage) nextStage.unlocked = true;
      }

      const mult = state.monthCardActive ? 1.2 : 1.0;
      const totalGain = b.mode === 'dungeon' ? 0 : (Math.round(b.rewardGem * mult) + b.bonusGem + storedBonus);
      if (b.mode !== 'dungeon') state.redGem += totalGain;

      state.modal = {
        type: 'victory',
        stageName: b.stageName,
        baseGem: b.rewardGem,
        bonusGem: b.bonusGem,
        storedBonus,
        totalGain,
        isFirstClear,
        countdown: 5
      };
      renderModal();
      if (b.mode !== 'dungeon') startVictoryCountdown();
    }

    function startVictoryCountdown() {
      clearModalCountdown();
      modalCountdownInterval = setInterval(() => {
        if (!state.modal || state.modal.type !== 'victory' || !state.battle) {
          clearModalCountdown();
          return;
        }
        state.modal.countdown--;
        const el = document.getElementById('victory-auto-cd');
        if (el) {
          el.textContent = state.battle.loopStage
            ? `${state.modal.countdown}s后自动重新挑战`
            : `${state.modal.countdown}s后自动下一关`;
        }
        if (state.modal.countdown <= 0) {
          clearModalCountdown();
          if (state.battle.loopStage) {
            startBattle(state.battle.stageId);
          } else {
            goToNextStageFromVictory();
          }
        }
      }, 1000);
    }

    function goToNextStageFromVictory() {
      if (!state.battle) return;
      const mode = state.battle.mode;
      const list = getModeSubstages(mode);
      const cur = list.find(s => s.id === state.battle.stageId);
      const next = cur ? list.find(s => s.chapterId === cur.chapterId && s.num === cur.num + 1) : null;
      if (next && next.unlocked) {
        startBattle(next.id, mode);
      } else {
        exitBattleTo('substages');
        showToast('本章已全部通关！');
      }
    }

    function triggerDefeat() {
      if (!state.battle) return;
      const b = state.battle;
      b.paused = true;
      clearModalCountdown();

      const mult = state.monthCardActive ? 1.2 : 1.0;
      const rawTotal = b.mode === 'dungeon' ? 0 : Math.round(b.rewardGem * mult);
      const storedAmount = b.mode === 'dungeon' ? 0 : Math.round(rawTotal * 0.4);
      const stage = getModeSubstages(b.mode).find(s => s.id === b.stageId);
      if (stage && b.mode !== 'dungeon') {
        stage.storedGem = (stage.storedGem || 0) + storedAmount;
      }

      state.modal = {
        type: 'defeat',
        stageName: b.stageName,
        baseGem: b.rewardGem,
        storedAmount,
        countdown: 5
      };
      renderModal();

      if (b.mode !== 'dungeon') {
        modalCountdownInterval = setInterval(() => {
          if (!state.modal || state.modal.type !== 'defeat') {
            clearModalCountdown();
            return;
          }
          state.modal.countdown--;
          const el = document.getElementById('defeat-auto-cd');
          if (el) el.textContent = `${state.modal.countdown}s后自动返回`;
          if (state.modal.countdown <= 0) {
            clearModalCountdown();
            exitBattleTo('substages');
          }
        }, 1000);
      }
    }

    function exitBattleTo(targetScreen, placeholderTitle = '') {
      clearModalCountdown();
      state.battle = null;
      state.modal = null;
      if (targetScreen === 'placeholder') {
        state.placeholderTitle = placeholderTitle;
        state.placeholderFrom = 'lobby';
      }
      state.screen = targetScreen;
      render();
    }

    // ==================== 竞技场匹配、战斗与结算 ====================
    function getArenaTier(idx = state.arena.tierIndex) {
      return state.arena.tiers[Math.max(0, Math.min(state.arena.tiers.length - 1, idx))];
    }

    function hasClaimableTierReward() {
      return state.arena.tiers.some(t => t.id <= state.arena.tierIndex && !t.claimed);
    }

    function openArenaMatching(roomType) {
      const tier = getArenaTier();
      if (roomType === 'high' && state.arena.tierIndex < 7) {
        showToast('需要达到「钻石-至尊王者」段位才能匹配高级场', 'warn');
        return;
      }
      state.arena.selectedRoom = roomType;
      clearModalCountdown();
      state.modal = { type: 'arena_matching', roomType };
      renderModal();
      arenaMatchTimeout = setTimeout(() => {
        if (state.modal && state.modal.type === 'arena_matching') {
          startArenaBattle(roomType);
        }
      }, 2000);
    }

    function startArenaBattle(roomType) {
      clearModalCountdown();
      const preset = state.presets[state.activePreset];
      const battleHeroes = preset.heroes.map((hKey, idx) => {
        const meta = state.heroMeta[hKey];
        return {
          slot: idx + 1,
          key: hKey,
          name: meta.name,
          color: meta.color,
          hat: meta.hat,
          symbol: meta.symbol,
          level: idx === 0 ? 3 : 1,
          enabled: true,
          dmg: 0,
          affixes: idx === 0 ? [
            { name: '召唤', icon: '⚡', desc: '伤害提升 <span class="text-emerald-600 font-black">30%</span>' },
            { name: '风刃连射', icon: '🍃', desc: '连射伤害 <span class="text-emerald-600 font-black">+20%</span>' },
            { name: '疾风骤雨', icon: '🌪️', desc: '攻速提升 <span class="text-emerald-600 font-black">15%</span>' },
            { name: '暴击专精', icon: '💥', desc: '暴击率提升 <span class="text-emerald-600 font-black">12%</span>' }
          ] : [
            { name: '基础射击', icon: meta.symbol, desc: '造成 <span class="text-emerald-600 font-black">100%</span> 基础伤害' }
          ]
        };
      });

      state.battle = {
        mode: 'arena',
        roomType,
        roomLabel: roomType === 'high' ? '高级场' : '中级场',
        paused: false,
        level: 1,
        exp: 0,
        expMax: 100,
        hp: 2800,
        hpMax: 2800,
        oppName: '寂寞的雪糕',
        oppTierName: getArenaTier().name,
        oppCannon: 1000,
        oppGold: 999999999,
        oppHp: 2800,
        oppHpMax: 2800,
        oppHeroes: ['fire', 'ice', 'thunder', 'wind'],
        poolGold: 999999999,
        cannonTier: 100,
        switchListOpen: false,
        statsOpen: false,
        activeAffixSlot: null,
        diceCd: 0,
        skillCd: 0,
        freeRefreshLeft: 10,
        freeRefreshMax: 10,
        heroes: battleHeroes
      };
      state.screen = 'arena_battle';
      state.modal = null;
      render();
      // 默认滚动到底部（己方视角）
      setTimeout(() => {
        const scroller = document.getElementById('arena-split-scroller');
        if (scroller) scroller.scrollTop = scroller.scrollHeight;
      }, 20);
    }

    function triggerArenaSettlement(isWin) {
      if (!state.battle) return;
      const b = state.battle;
      b.paused = true;
      clearModalCountdown();

      const oldTierIdx = state.arena.tierIndex;
      const oldTier = getArenaTier(oldTierIdx);
      const oldPts = state.arena.points;
      const delta = isWin ? 30 : -30;
      const newPts = Math.max(0, oldPts + delta);
      state.arena.points = newPts;

      // 计算新段位
      let newTierIdx = oldTierIdx;
      for (let i = state.arena.tiers.length - 1; i >= 0; i--) {
        if (newPts >= state.arena.tiers[i].minPts) {
          newTierIdx = i;
          break;
        }
      }
      state.arena.tierIndex = newTierIdx;
      const newTier = getArenaTier(newTierIdx);

      const coinGain = isWin ? 30 : 15;
      state.arena.coins += coinGain;
      state.arena.history.unshift({
        room: b.roomLabel,
        date: '11.26',
        win: isWin,
        oppName: b.oppName,
        oppPower: '99w',
        delta
      });

      state.modal = {
        type: 'arena_settlement',
        isWin,
        oldTier,
        newTier,
        tierChanged: newTierIdx !== oldTierIdx,
        oldPts,
        newPts,
        delta,
        coinGain,
        oppName: b.oppName
      };
      renderModal();
    }

    // ==================== 奖池场逻辑 ====================
    function startPoolBattle(roomType) {
      clearModalCountdown();
      state.poolField.room = roomType;
      const preset = state.presets[state.activePreset];
      const battleHeroes = preset.heroes.map((hKey, idx) => {
        const meta = state.heroMeta[hKey];
        return {
          slot: idx + 1,
          key: hKey,
          name: meta.name,
          color: meta.color,
          hat: meta.hat,
          symbol: meta.symbol,
          level: idx === 0 ? 3 : 1,
          enabled: true,
          dmg: 0,
          affixes: idx === 0 ? [
            { name: '召唤', icon: '⚡', desc: '伤害提升 <span class="text-emerald-600 font-black">30%</span>' },
            { name: '风刃连射', icon: '🍃', desc: '连射伤害 <span class="text-emerald-600 font-black">+20%</span>' },
            { name: '疾风骤雨', icon: '🌪️', desc: '攻速提升 <span class="text-emerald-600 font-black">15%</span>' },

        };

        mode: 'pool',

        hpMax: 2800,
        oppName: '寂寞的雪糕',
        oppCannon: 1000,
        oppGold: 999999999,
        oppGem: 999999999,

        oppHpMax: 2800,
        oppHeroes: ['fire', 'ice', 'thunder', 'wind'],

        poolGem: 999999999,

        autoAtk: true,
        rage: false,
        lockTarget: false,
        switchListOpen: false,
        activeAffixSlot: null,
        skillCd: 0,
        pkActive: false,
        pkTimeLeft: 30,
        myPkDmg: 0,
        oppPkDmg: 0,
        heroes: battleHeroes

      state.screen = 'pool_battle';

    function sendPoolPkInvite() {
      if (!state.battle || state.battle.pkActive) {
        showToast('当前已在征战PK中');
        return;
      }
      clearModalCountdown();
      state.modal = { type: 'pool_pk_waiting', countdown: 10 };
      renderModal();

      let accepted = false;
      modalCountdownInterval = setInterval(() => {
        if (!state.modal || state.modal.type !== 'pool_pk_waiting') {
          clearModalCountdown();
          return;
        }
        state.modal.countdown--;
        const el = document.getElementById('pk-wait-cd');
        if (el) el.textContent = `${state.modal.countdown}s后对方未接受，本次邀请结束`;
        // 演示：约2秒后模拟对方接受邀请
        if (state.modal.countdown === 8 && !accepted) {
          accepted = true;
          clearModalCountdown();
          state.modal = null;
          activatePoolPk();
          showToast('对方已接受邀请！扭蛋机PK开启', 'success');
          render();
          return;
        }
        if (state.modal.countdown <= 0) {
          clearModalCountdown();
          state.modal = null;
          renderModal();
        }
      }, 1000);
    }

    function openReceivePoolPkInvite() {
      if (!state.battle || state.screen !== 'pool_battle') return;
      clearModalCountdown();
      state.modal = { type: 'pool_pk_receive', countdown: 10 };
      renderModal();
      modalCountdownInterval = setInterval(() => {
        if (!state.modal || state.modal.type !== 'pool_pk_receive') {
          clearModalCountdown();
          return;
        }
        state.modal.countdown--;
        const el = document.getElementById('pk-recv-cd');
        if (el) el.textContent = `${state.modal.countdown}s后未选择则自动拒绝`;
        if (state.modal.countdown <= 0) {
          clearModalCountdown();
          state.modal = null;
          showToast('已超时自动拒绝PK邀请');
          renderModal();
        }
      }, 1000);
    }

    function activatePoolPk() {
      if (!state.battle) return;
      state.battle.pkActive = true;
      state.battle.pkTimeLeft = 30;
      state.battle.myPkDmg = 2400;
      state.battle.oppPkDmg = 1500;
    }

    function triggerPoolPkSettlement(isWin) {
      if (!state.battle) return;
      const b = state.battle;
      b.pkActive = false;
      b.paused = true;
      clearModalCountdown();

      const rewardGold = isWin ? 999999999 : 0;
      if (isWin) state.gold += 500000;

      state.modal = {
        type: 'pool_pk_settlement',
        isWin,
        rewardGold,
        oppName: b.oppName,
        countdown: 10
      };
      renderModal();

      modalCountdownInterval = setInterval(() => {
        if (!state.modal || state.modal.type !== 'pool_pk_settlement') {
          clearModalCountdown();
          return;
        }
        state.modal.countdown--;
        const el = document.getElementById('pk-settle-cd');
        if (el) el.textContent = `${state.modal.countdown}s后自动关闭`;
        if (state.modal.countdown <= 0) {
          clearModalCountdown();
          state.modal = null;
          if (state.battle) state.battle.paused = false;
          render();
        }
      }, 1000);
    }

    function openPoolReviveModal() {
      if (!state.battle) return;
      state.battle.paused = true;
      clearModalCountdown();
      state.modal = { type: 'pool_revive', countdown: 30 };
      renderModal();

      modalCountdownInterval = setInterval(() => {
        if (!state.modal || state.modal.type !== 'pool_revive') {
          clearModalCountdown();
          return;
        }
        state.modal.countdown--;
        const el = document.getElementById('pool-revive-cd');
        if (el) el.textContent = `${state.modal.countdown}s后离场`;
        if (state.modal.countdown <= 0) {
          clearModalCountdown();
          exitBattleTo('pool_lobby');
        }
      }, 1000);
    }

    function renderRightHeroEnhanceBar(heroes) {
      return `
        <button id="btn-battle-details" class="mt-1.5 w-11 h-11 rounded-xl bg-white/95 hover:bg-amber-50 border-2 border-slate-600 text-slate-900 text-[10px] font-black leading-tight flex flex-col items-center justify-center shadow transition active:scale-95">
          <span>📋</span><span>战斗<br>详情</span>
        </button>

    // ==================== SVG 图标组件 ====================
    function renderHeroAvatarSvg(key, size = 44) {
      const m = state.heroMeta[key];
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 48 48" class="shrink-0">

    function renderCastleSvg(color, accent) {
      return `
        <svg width="118" height="84" viewBox="0 0 120 86" class="drop-shadow-lg">
          <ellipse cx="60" cy="76" rx="52" ry="9" fill="#d97706" fill-opacity="0.35" stroke="#1e293b" stroke-width="2"/>
          <rect x="20" y="34" width="80" height="40" rx="2" fill="${color}" stroke="#1e293b" stroke-width="3"/>
          <rect x="20" y="22" width="14" height="14" fill="${color}" stroke="#1e293b" stroke-width="3"/>
          <rect x="44" y="16" width="32" height="20" fill="${color}" stroke="#1e293b" stroke-width="3"/>
          <rect x="86" y="22" width="14" height="14" fill="${color}" stroke="#1e293b" stroke-width="3"/>

    // ==================== 界面渲染 ====================
    function render() {
      const root = document.getElementById('screen-root');
      const dbgRoute = document.getElementById('debug-route');
      const routeNames = {
        lobby: '大厅（战斗）',
        chapters: `${state.mode === 'dungeon' ? '副本场' : '闯关场'} - 章节列表`,
        substages: `${state.mode === 'dungeon' ? '副本场' : '闯关场'} - 小关卡选择（野兽岛）`,
        battle: `战斗场内（${state.battle ? state.battle.stageName : ''}）`,
        arena_lobby: '竞技场大厅',
        arena_pool: `${state.arena.poolRoom === 'high' ? '竞技高级场' : '竞技中级场'}奖池`,
        arena_battle: `竞技场战斗（${state.battle ? state.battle.roomLabel : ''}）`,
        pool_lobby: '奖池场大厅',
        pool_detail: `${state.poolField.room === 'high' ? '奖池高级场' : '奖池中级场'}详情`,
        pool_battle: `奖池场战斗（${state.battle ? state.battle.roomLabel : ''}）`,
        placeholder: `占位界面 - ${state.placeholderTitle}`
      };
      if (dbgRoute) dbgRoute.textContent = routeNames[state.screen] || state.screen;

      // 更新调试按钮可用状态
      const inBattle = (state.screen === 'battle' || state.screen === 'arena_battle' || state.screen === 'pool_battle') && state.battle;
      ['dbg-levelup', 'dbg-win', 'dbg-lose'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = !inBattle;
      });
      const inPool = state.screen === 'pool_battle' && state.battle;
      ['dbg-pk-receive', 'dbg-pool-die'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = !inPool;
      });

      if (state.screen === 'lobby') renderLobby(root);
      else if (state.screen === 'chapters') renderChapters(root);
      else if (state.screen === 'substages') renderSubstages(root);
      else if (state.screen === 'battle') renderBattle(root);
      else if (state.screen === 'arena_lobby') renderArenaLobby(root);
      else if (state.screen === 'arena_pool') renderArenaPool(root);
      else if (state.screen === 'arena_battle') renderArenaBattle(root);
      else if (state.screen === 'pool_lobby') renderPoolLobby(root);
      else if (state.screen === 'pool_detail') renderPoolDetail(root);
      else if (state.screen === 'pool_battle') renderPoolBattle(root);
      else if (state.screen === 'placeholder') renderPlaceholderScreen(root);

      renderModal();
    }

          if (h) { h.enabled = !h.enabled; render(); }

      root.querySelectorAll('[data-affix-slot]').forEach(btn => {

          b.paused = true;

          renderModal();
        });
      }
      document.getElementById('btn-cannon-minus').addEventListener('click', () => { if (b.cannonTier > 100) { b.cannonTier -= 100; render(); } });

    function renderPoolBattleDynamicParts() {
      const b = state.battle;
      if (!b) return;
      const g = (id) => document.getElementById(id);
      if (g('pool-my-hp-text')) g('pool-my-hp-text').textContent = `❤️ ${b.hp}`;
      if (g('pool-my-hp-bar')) g('pool-my-hp-bar').style.width = `${Math.max(0, Math.round(b.hp / b.hpMax * 100))}%`;
      if (g('btn-hero-skill')) g('btn-hero-skill').innerHTML = b.skillCd > 0 ? `${b.skillCd}s` : '角色<br>技能';
      if (b.pkActive) {
        const tot = Math.max(1, b.myPkDmg + b.oppPkDmg);
        const oppPct = Math.round((b.oppPkDmg / tot) * 100);
        if (g('pool-pk-cd')) g('pool-pk-cd').textContent = `${b.pkTimeLeft}s后结算`;
        if (g('pool-pk-opp-bar')) {
          g('pool-pk-opp-bar').style.width = `${oppPct}%`;
          g('pool-pk-opp-bar').textContent = `敌方: ${fmtNum(b.oppPkDmg)}`;
        }
        if (g('pool-pk-my-bar')) g('pool-pk-my-bar').textContent = `我方: ${fmtNum(b.myPkDmg)}`;
      }
    }

        render();

        mRoot.classList.add('hidden');

      mRoot.className = 'absolute inset-0 z-40 bg-slate-950/75 backdrop-blur-xs flex items-center justify-center p-4';

      if (m.type === 'pause') {

        mRoot.innerHTML = `
          <div class="w-full bg-white text-slate-900 rounded-2xl p-4 shadow-2xl border-2 border-slate-700">

            <div class="grid grid-cols-3 gap-2 mb-4">

            ${!isDungeon ? `

            <h2 class="text-xl font-black">PK邀请中</h2>
            <p class="text-sm font-bold text-slate-800">等待玩家[寂寞的雪糕]接收邀请中</p>
            <div id="pk-wait-cd" class="text-xs text-slate-500">${m.countdown}s后对方未接受，本次邀请结束</div>
          </div>
        `;
      }
      else if (m.type === 'pool_pk_receive') {
        mRoot.innerHTML = `
          <div class="w-full max-w-xs bg-white text-slate-900 rounded-2xl p-5 shadow-2xl border-2 border-slate-700 text-center space-y-3">
            <h2 class="text-xl font-black">PK邀请</h2>
            <p class="text-sm font-bold text-slate-800">玩家[寂寞的雪糕]向您申请PK邀请，是否接受?</p>
            <div class="grid grid-cols-2 gap-3 pt-1">
              <button id="m-pk-accept" class="py-2 rounded-xl border-2 border-slate-700 bg-amber-400 font-black text-sm hover:bg-amber-300">接受</button>
              <button id="m-pk-reject" class="py-2 rounded-xl border-2 border-slate-500 bg-white font-bold text-sm hover:bg-slate-100">拒绝</button>
            </div>
            <div id="pk-recv-cd" class="text-xs text-slate-500">${m.countdown}s后未选择则自动拒绝</div>
          </div>
        `;
        document.getElementById('m-pk-accept').addEventListener('click', () => {
          clearModalCountdown();
          state.modal = null;
          activatePoolPk();
          showToast('已接受PK邀请！扭蛋机争夺开始', 'success');
          render();
        });
        document.getElementById('m-pk-reject').addEventListener('click', () => {
          clearModalCountdown();
          state.modal = null;
          showToast('已拒绝PK邀请');
          renderModal();
        });
      }
      else if (m.type === 'pool_pk_settlement') {
        mRoot.innerHTML = `
          <div class="w-full bg-white text-slate-900 rounded-2xl p-4 shadow-2xl border-2 border-slate-700 space-y-3">
            <h2 class="text-2xl font-black text-center ${m.isWin ? 'text-amber-500' : 'text-slate-400'}">${m.isWin ? '挑战胜利' : '挑战失败'}</h2>
            <div class="flex h-11 rounded-xl overflow-hidden border-2 border-slate-700 text-xs font-black">
              <div class="${m.isWin ? 'w-3/5' : 'w-2/5'} bg-cyan-300 flex items-center justify-center gap-1.5 px-2">
                <span class="w-7 h-7 rounded-full bg-white border border-slate-600 flex items-center justify-center">😎</span>
                <span class="truncate">我方</span>
              </div>
              <div class="${m.isWin ? 'w-2/5' : 'w-3/5'} bg-rose-400 text-white flex items-center justify-center gap-1.5 px-2">
                <span class="w-7 h-7 rounded-full bg-white text-slate-800 border border-slate-600 flex items-center justify-center">😈</span>
                <span class="truncate">${m.oppName}</span>
              </div>
            </div>
            ${m.isWin ? `
              <div class="border border-slate-400 rounded-xl p-4 bg-slate-50">
                <div class="text-xs font-extrabold text-slate-700 mb-2">征战奖励</div>
                <div class="flex items-center justify-center gap-4">
                  <span class="px-3 py-2 rounded-lg border border-slate-400 bg-white text-xs font-black">🪙 金币</span>
                  <span class="text-xl font-black text-slate-900 tabular-nums">${fmtNum(m.rewardGold)}</span>
                </div>
              </div>
            ` : `
              <div class="py-6 text-center text-xl font-black text-slate-700">下次再接再厉</div>
            `}
            <div class="text-center space-y-1.5">
              <button id="m-pk-settle-back" class="px-8 py-2 rounded-xl border-2 border-slate-600 bg-white font-bold text-sm hover:bg-slate-100">返回</button>
              <div id="pk-settle-cd" class="text-xs text-slate-500">${m.countdown}s后自动关闭</div>
            </div>
          </div>
        `;
        document.getElementById('m-pk-settle-back').addEventListener('click', () => {
          clearModalCountdown();
          state.modal = null;
          if (state.battle) state.battle.paused = false;
          render();
        });
      }
      else if (m.type === 'pool_revive') {
        mRoot.innerHTML = `
          <div class="w-full max-w-xs bg-white text-slate-900 rounded-2xl p-5 shadow-2xl border-2 border-slate-700 text-center space-y-4">
            <h2 class="text-lg font-black">您已阵亡，是否立即复活?</h2>
            <div class="grid grid-cols-2 gap-3">
              <button id="m-previve-ok" class="py-2 rounded-xl border-2 border-slate-700 bg-amber-400 font-black text-xs hover:bg-amber-300 leading-tight">金币x1000<br>立即复活</button>
              <button id="m-previve-quit" class="py-2 rounded-xl border-2 border-slate-500 bg-white font-bold text-sm hover:bg-slate-100">放弃退出</button>
            </div>
            <div id="pool-revive-cd" class="text-xs text-slate-500">${m.countdown}s后离场</div>
          </div>
        `;
        document.getElementById('m-previve-ok').addEventListener('click', () => {
          if (state.gold < 1000) { showToast('金币不足', 'warn'); return; }
          state.gold -= 1000;
          clearModalCountdown();
          state.modal = null;
          if (state.battle) {
            state.battle.hp = state.battle.hpMax;
            state.battle.paused = false;
          }
          showToast('消耗 1000 金币复活成功！', 'success');
          render();
        });
        document.getElementById('m-previve-quit').addEventListener('click', () => {
          clearModalCountdown();
          exitBattleTo('pool_lobby');
        });
      }
      else if (m.type === 'recharge_prompt') {
        mRoot.innerHTML = `
          <div class="w-full max-w-xs bg-white text-slate-900 rounded-2xl p-5 shadow-2xl border-2 border-slate-700 text-center space-y-3">
            <div class="flex items-center justify-between">
              <div class="w-6"></div>
              <h2 class="text-lg font-black">金币充值</h2>
              <button id="m-rech-close" class="w-7 h-7 rounded-lg bg-rose-500 text-white font-black text-sm">✕</button>
            </div>
            <div class="text-3xl">🪙</div>
            <p class="text-xs text-slate-600">当前金币不足，无法满足「野兽岛」最低金币携带要求（100 金币）。</p>
            <div class="space-y-2 pt-1">
              <button id="m-rech-buy" class="w-full py-2.5 rounded-xl bg-amber-400 border-2 border-amber-600 text-slate-900 font-black text-xs hover:bg-amber-300">模拟充值 +10,000 金币</button>
              <button id="m-rech-cancel" class="w-full py-2 rounded-xl border border-slate-400 bg-white text-slate-700 font-bold text-xs hover:bg-slate-100">关闭</button>
            </div>
          </div>
        `;
        const onCloseRecharge = () => {
          if (state.dungeonTickets >= 1) {
            state.modal = { type: 'dungeon_redirect_confirm', chapterId: m.chapterId };
            renderModal();
          } else {
            state.modal = null;
            renderModal();
          }
        };
        document.getElementById('m-rech-close').addEventListener('click', onCloseRecharge);
        document.getElementById('m-rech-cancel').addEventListener('click', onCloseRecharge);
        document.getElementById('m-rech-buy').addEventListener('click', () => {
          state.gold += 10000;
          state.modal = null;
          updateGoldDebugBtn();
          showToast('充值成功 +10,000 金币', 'success');
          render();
        });
      }
      else if (m.type === 'dungeon_redirect_confirm') {
        mRoot.innerHTML = `
          <div class="w-full max-w-xs bg-white text-slate-900 rounded-2xl p-5 shadow-2xl border-2 border-slate-700 text-center space-y-4">
            <h2 class="text-2xl font-black">副本挑战</h2>
            <p class="text-sm font-black text-slate-800 leading-relaxed">
              是否 <span class="inline-flex items-center justify-center w-5 h-5 rounded-full border border-slate-700 bg-slate-100 text-[11px] font-black align-middle">券</span> 消耗进入副本场<br>挑战关卡
            </p>
            <div class="inline-flex items-center gap-1.5 text-sm font-extrabold">
              <span class="w-5 h-5 rounded-full border border-slate-700 bg-slate-100 text-[11px] font-black inline-flex items-center justify-center">券</span>
              <span>剩余数：<span class="text-lime-600">${state.dungeonTickets}</span>/1</span>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-1">
              <button id="m-dred-go" class="py-2 rounded-xl border-2 border-slate-700 bg-white hover:bg-amber-50 font-extrabold text-sm">挑战</button>
              <button id="m-dred-no" class="py-2 rounded-xl border-2 border-slate-500 bg-white hover:bg-slate-100 font-bold text-sm">暂不考虑</button>
            </div>
          </div>
        `;
        document.getElementById('m-dred-go').addEventListener('click', () => {
          state.modal = null;
          state.mode = 'dungeon';
          state.selectedChapterId = m.chapterId || 'beast';
          state.quickGoOpen = false;
          state.screen = 'substages';
          render();
        });
        document.getElementById('m-dred-no').addEventListener('click', () => {
          state.modal = null;
          renderModal();
        });
      }
      else if (m.type === 'hero_selected_cards') {
        const b = state.battle;
        const hero = b && (b.heroes.find(h => h.slot === m.slot) || b.heroes[0]);
        if (!hero) { state.modal = null; renderModal(); return; }
        mRoot.className = 'absolute inset-0 z-40 bg-slate-950/35 flex items-center justify-center p-3.5';
        mRoot.innerHTML = `
          <div class="w-full bg-white/90 backdrop-blur-xs text-slate-900 rounded-2xl p-3.5 shadow-2xl border-2 border-slate-700 flex flex-col max-h-[82vh]">
            <div class="flex items-center justify-between mb-2">
              <div class="w-7"></div>
              <h2 class="text-xl font-black text-slate-900">已选择词条</h2>
              <button id="m-hcards-close" class="w-7 h-7 rounded-lg bg-rose-500 text-white font-black text-sm">✕</button>
            </div>

            <!-- 4 英雄切换头像 -->
            <div class="flex items-center justify-center gap-2.5 mb-3">
              ${b.heroes.map(h => `
                <button data-switch-detail-hero="${h.slot}" class="flex flex-col items-center p-1 rounded-full border-2 ${h.slot === hero.slot ? 'border-amber-500 bg-amber-200 shadow-sm scale-105' : 'border-slate-400 bg-white hover:bg-slate-50'} transition">
                  ${renderHeroAvatarSvg(h.key, 30)}
                </button>
              `).join('')}
            </div>

            <!-- 4 列词条卡片网格 -->
            <div class="flex-1 overflow-y-auto grid grid-cols-4 gap-1.5 pr-0.5 no-scrollbar content-start">
              ${hero.affixes.map(af => `
                <div class="rounded-lg border border-slate-500 bg-white overflow-hidden flex flex-col shadow-xs min-h-[96px]">
                  <div class="bg-slate-100 border-b border-slate-300 text-[10px] font-black text-slate-900 text-center py-1 px-0.5 truncate">${af.name}</div>
                  <div class="flex-1 p-1.5 flex flex-col items-center justify-center text-center gap-1">
                    <span class="text-sm leading-none">${af.icon}</span>
                    <div class="text-[9px] font-bold text-slate-700 leading-tight">${af.desc}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        mRoot.querySelectorAll('[data-switch-detail-hero]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.modal.slot = Number(btn.getAttribute('data-switch-detail-hero'));
            renderModal();
          });
        });
        document.getElementById('m-hcards-close').addEventListener('click', () => {
          state.modal = null;
          if (state.battle) state.battle.paused = false;
          renderModal();
        });
      }
      else if (m.type === 'defeat') {
        const b = state.battle;
        mRoot.innerHTML = `
          <div class="w-full bg-white text-slate-900 rounded-2xl p-4 shadow-2xl border-2 border-slate-700 space-y-3">
            <div class="text-center">
              <div class="inline-block bg-slate-700 text-white border-2 border-slate-900 px-6 py-1 rounded-xl text-xl font-black">挑战失败</div>
              <div class="text-sm font-extrabold text-slate-700 mt-1">${m.stageName}</div>
            </div>

            <div class="border border-slate-300 rounded-xl p-2 bg-slate-50">
              <div class="text-[11px] font-bold text-slate-500 mb-1">战斗统计</div>
              <div class="grid grid-cols-2 gap-1.5">
                ${b.heroes.map(h => `
                  <div class="flex items-center gap-1.5 text-xs font-extrabold">
                    ${renderHeroAvatarSvg(h.key, 24)}
                    <span class="truncate">${h.name}</span>
                    <span class="text-slate-700 ml-auto tabular-nums">${fmtNum(h.dmg)}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- 战力提升引导 -->
            <div class="grid grid-cols-3 gap-2">
              ${['英雄', '宝石', '装备'].map(up => `
                <button data-upgrade-jump="${up}" class="relative py-2 rounded-xl border-2 border-slate-500 bg-white font-extrabold text-xs hover:bg-amber-50 active:scale-95 transition">
                  <span class="absolute -top-2 -right-1 text-rose-600 text-sm font-black">⬆</span>
                  ${up}
                </button>
              `).join('')}
            </div>

            ${b.mode !== 'dungeon' ? `
              <div class="border border-slate-300 rounded-xl p-2.5 bg-rose-50/40 text-center">
                <div class="flex items-center justify-between text-xs font-bold mb-1">
                  <span>本次战斗获得</span>
                  <span class="text-[10px] ${state.monthCardActive ? 'text-amber-600' : 'text-slate-400'}">${state.monthCardActive ? '月卡特权生效中' : '未开通月卡'}</span>
                </div>
                <div class="text-sm font-black text-rose-600">💎 ${fmtNum(m.baseGem)} × ${state.monthCardActive ? '120%' : '100%'}</div>
                <div class="text-[11px] font-extrabold text-rose-700 mt-1">本次奖励已经存储40%（💎${fmtNum(m.storedAmount)}），下次挑战成功可领</div>
              </div>
            ` : ''}

            <div class="border border-slate-300 rounded-xl p-2">
              <div class="text-[11px] font-bold text-slate-600 mb-1">挑战奖励</div>
              <div class="grid grid-cols-2 gap-2">
                <div class="py-1.5 rounded-lg border border-slate-300 bg-slate-50 text-center text-[11px] font-bold">🪙 金币 +200</div>
                <div class="py-1.5 rounded-lg border border-slate-300 bg-slate-50 text-center text-[11px] font-bold">📜 经验 +50</div>
              </div>
            </div>

            <div class="text-center space-y-2">
              <div class="grid grid-cols-2 gap-3">
                <button id="m-def-retry" class="py-2 rounded-xl border-2 border-slate-700 bg-amber-400 font-black text-sm hover:bg-amber-300">再次挑战</button>
                <button id="m-def-back" class="py-2 rounded-xl border-2 border-slate-500 bg-white font-bold text-sm hover:bg-slate-100">返回</button>
              </div>
              ${b.mode !== 'dungeon' ? `<div id="defeat-auto-cd" class="text-xs font-bold text-slate-500">${m.countdown}s后自动返回</div>` : ''}
            </div>
          </div>
        `;
        mRoot.querySelectorAll('[data-upgrade-jump]').forEach(btn => {
          btn.addEventListener('click', () => exitBattleTo('placeholder', btn.getAttribute('data-upgrade-jump')));
        });
        document.getElementById('m-def-retry').addEventListener('click', () => startBattle(b.stageId));
        document.getElementById('m-def-back').addEventListener('click', () => exitBattleTo('substages'));
      }
    }

    // ==================== 控制台事件绑定 ====================
    document.getElementById('btn-reset-demo').addEventListener('click', () => {
      clearModalCountdown();
      state = createInitialState();
      showToast('原型数据已重置');
      render();
    });
    document.getElementById('dbg-levelup').addEventListener('click', () => {
      if ((state.screen === 'battle' || state.screen === 'arena_battle' || state.screen === 'pool_battle') && state.battle) {
        state.battle.level = (state.battle.level || 1) + 1;
        state.battle.exp = 0;
        openSkillChoiceModal();
      }
    });
    document.getElementById('dbg-win').addEventListener('click', () => {
      if (state.screen === 'battle' && state.battle) triggerVictory();
      else if (state.screen === 'arena_battle' && state.battle) triggerArenaSettlement(true);
      else if (state.screen === 'pool_battle' && state.battle) triggerPoolPkSettlement(true);
    });
    document.getElementById('dbg-lose').addEventListener('click', () => {
      if (state.screen === 'battle' && state.battle) triggerDefeat();
      else if (state.screen === 'arena_battle' && state.battle) triggerArenaSettlement(false);
      else if (state.screen === 'pool_battle' && state.battle) triggerPoolPkSettlement(false);
    });
    document.getElementById('dbg-pk-receive').addEventListener('click', () => {
      if (state.screen === 'pool_battle' && state.battle) openReceivePoolPkInvite();
    });
    document.getElementById('dbg-pool-die').addEventListener('click', () => {
      if (state.screen === 'pool_battle' && state.battle) openPoolReviveModal();
    });
    function updateGoldDebugBtn() {
      const btn = document.getElementById('dbg-toggle-gold');
      if (btn) btn.textContent = `切换金币充足/不足（当前：${state.gold >= 100 ? '充足' : '不足'}）`;
    }

    document.getElementById('dbg-toggle-gold').addEventListener('click', () => {
      state.gold = state.gold >= 100 ? 50 : 999999999;
      updateGoldDebugBtn();
      showToast(state.gold >= 100 ? '当前金币已设为充足' : '当前金币已设为不足 (50)', state.gold >= 100 ? 'success' : 'warn');
      render();
    });

    document.getElementById('dbg-toggle-month').addEventListener('click', () => {
      state.monthCardActive = !state.monthCardActive;
      showToast(`月卡特权已${state.monthCardActive ? '开启 (120%)' : '关闭 (100%)'}`);
      if (state.modal && (state.modal.type === 'victory' || state.modal.type === 'defeat')) renderModal();
    });

    // 启动
    window.addEventListener('DOMContentLoaded', () => {
      render();
      startMainLoop();
    });
  </script>
</body>
</html>
